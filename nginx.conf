server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Single-page app routing.
    #
    # React Router handles /menu, /checkout, /profile in the browser - those
    # paths do not exist as files. Without this, a hard refresh or a pasted
    # link to any route other than "/" returns a 404 from nginx, because it
    # looks for a file called "menu" and finds nothing.
    #
    # try_files says: serve the real file if it exists, otherwise hand back
    # index.html and let the router sort it out.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite fingerprints built assets (index-DXEn_wpP.js). The filename changes
    # whenever the content does, so these can be cached effectively forever -
    # a new deploy produces new names rather than stale files.
    location /assets/ {
        # One explicit Cache-Control rather than `expires 1y`, which would emit
        # a second, competing Cache-Control header alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must NOT be cached: it is the file that points at the current
    # asset names. Cache it and returning visitors keep loading the old build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------
    # NOTE: the security headers are repeated in every location block on
    # purpose, and this is the nginx behaviour that most often catches people
    # out:
    #
    #   add_header directives are inherited from the enclosing block ONLY IF
    #   the current block defines no add_header directives of its own.
    #
    # One add_header anywhere in a location silently discards every header
    # inherited from `server`. Declaring them once at server level looks
    # correct, passes review, and ships a site with no security headers at
    # all - which is exactly what happened here before this was fixed.
    # ------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
}
