<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Fonts are bundled with the app (see src/main.jsx). Open the connections
         the home page needs anyway before the script has run: the API for the
         featured cakes, and the hosts the cake photos come from. -->
    <link rel="preconnect" href="https://api-sweetnest.aaryanbasnet.com.np" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- The home page's hero cakes, requested now instead of after the app has
         downloaded and started: the hero photo is the biggest thing on the page
         and its address is in this answer. The app picks the pending answer up
         from window.__earlyFeatured (src/lib/earlyFeatured.js). A plain GET with
         no custom headers, so the browser needs no CORS pre-check first. -->
    <script>
      (function () {
        var base = '%VITE_API_BASE_URL%';
        if (base.indexOf('http') !== 0) return;
        try {
          var promise = fetch(base + '/cakes/featured?limit=2')
            .then(function (response) {
              if (!response.ok) throw new Error('featured ' + response.status);
              return response.json();
            })
            .then(function (body) {
              // Begin loading the first hero photo as soon as its address is known
              var cake = body && body.data && body.data[0];
              var image = cake && cake.images && cake.images[0];
              var src = image && (image.url || image);
              if (src) new Image().src = src;
              return body;
            });
          promise.catch(function () {});
          window.__earlyFeatured = { limit: 2, promise: promise };
        } catch (error) {
          /* the app asks again in the usual way */
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweetNest | Handmade Cakes, Designed by You</title>
    <meta name="description" content="Handmade cakes from SweetNest. Browse the menu, design your own cake in 3D, and order online for delivery." />
    <meta name="theme-color" content="#2C2420" />
    <link rel="canonical" href="https://sweetnest.aaryanbasnet.com.np/" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SweetNest" />
    <meta property="og:title" content="SweetNest | Handmade Cakes, Designed by You" />
    <meta property="og:description" content="Handmade cakes from SweetNest. Browse the menu, design your own cake in 3D, and order online for delivery." />
    <meta property="og:url" content="https://sweetnest.aaryanbasnet.com.np/" />
    <meta property="og:image" content="https://sweetnest.aaryanbasnet.com.np/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SweetNest: handmade cakes, designed by you" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SweetNest | Handmade Cakes, Designed by You" />
    <meta name="twitter:description" content="Handmade cakes from SweetNest. Browse the menu, design your own cake in 3D, and order online for delivery." />
    <meta name="twitter:image" content="https://sweetnest.aaryanbasnet.com.np/og-image.jpg" />
  </head>
