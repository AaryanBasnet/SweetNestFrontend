# =============================================================================
# SweetNest Frontend
#
#   docker compose up --build
#
# Serves the production build on http://localhost:8080.
# The API runs from the backend repo's own compose file (api + mongo). For the whole app
# in one command, use docker-compose.fullstack.yml in the backend repository.
#
# VITE_API_BASE_URL is a BUILD argument, not a runtime environment variable.
# Vite inlines it into the JavaScript bundle at build time, so changing it
# requires a rebuild - and it must never hold a secret, because anyone can
# read it in the shipped code.
# =============================================================================

services:
  web:
    # "up --build" builds this folder and tags it with this name; "pull" downloads the
    # image CI published under the same name.
    image: ghcr.io/aaryanbasnet/sweetnest-web:${WEB_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
        GIT_SHA: ${GIT_SHA:-local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
