name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run build

      # A production build that suddenly doubles in size is worth noticing
      # before it ships, not after. Printed, not enforced - a hard budget
      # belongs here once the 1.7MB three.js chunk has been split.
      - name: Report bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js dist/assets/*.css 2>/dev/null \
            | sort -rh | head -15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base branch present locally to diff against it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # ---------------------------------------------------------------------
      # This lints ONLY the files the pull request touches, not the whole app.
      #
      # Why: the codebase carries ~81 pre-existing lint errors across 44 files
      # (unused variables, plus the React Compiler rules that arrived with
      # eslint-plugin-react-hooks v7). Turning those into a required check on
      # day one would mean every PR starts red, and a check that is always red
      # gets ignored - which is worse than no check.
      #
      # Gating changed files instead means new and edited code has to be clean,
      # so the debt shrinks as the app is worked on rather than growing. Swap
      # this for a plain `npm run lint` once the backlog reaches zero.
      # ---------------------------------------------------------------------
      - name: Lint changed files
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
            | grep -E '\.(js|jsx)$' || true)

          if [ -z "$CHANGED" ]; then
            echo "No JavaScript files changed."
            exit 0
          fi

          echo "Linting:"
          echo "$CHANGED"
          npx eslint $CHANGED

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sweetnest-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves nginx serves the build AND that SPA deep links work - the
      # try_files rule is easy to break and the failure only shows up when
      # somebody refreshes on a route that is not /.
      - name: Smoke test the image
        run: |
          docker run -d --name web-smoke -p 8080:80 sweetnest-web:ci
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done

          for path in / /menu /checkout /profile; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080$path)
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "SPA routing broken for $path"
              docker logs web-smoke
              exit 1
            fi
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high
