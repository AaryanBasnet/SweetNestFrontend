name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run build

      # A production build that suddenly doubles in size is worth noticing
      # before it ships, not after. Printed, not enforced - a hard budget
      # belongs here once the 1.7MB three.js chunk has been split.
      - name: Report bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js dist/assets/*.css 2>/dev/null \
            | sort -rh | head -15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The backend needs a real MongoDB, exactly as in its own CI.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The tests drive the real backend, so check it out next to this app.
      # Playwright (playwright.config.js) starts both and points them at an
      # empty test database.
      - uses: actions/checkout@v4
        with:
          repository: AaryanBasnet/SweetNestBackend
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: backend

      - run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: npx playwright test
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend

      # Screenshots and traces of anything that failed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # The whole app is lint-clean, so the whole app is checked. Exceptions are
      # written next to the code that needs them, each with its reason.
      - name: Lint
        run: npm run lint

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sweetnest-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves nginx serves the build AND that SPA deep links work - the
      # try_files rule is easy to break and the failure only shows up when
      # somebody refreshes on a route that is not /.
      - name: Smoke test the image
        run: |
          docker run -d --name web-smoke -p 8080:80 sweetnest-web:ci
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done

          for path in / /menu /checkout /profile; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080$path)
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "SPA routing broken for $path"
              docker logs web-smoke
              exit 1
            fi
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high
